<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hollow Reign - Eldritch Horde Survival</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2305050a'/><polygon points='50,15 85,80 15,80' stroke='%23a855f7' stroke-width='6' fill='none'/><circle cx='50' cy='55' r='12' fill='%23c084fc'/><circle cx='50' cy='55' r='5' fill='%2305050a'/></svg>" />
    <!-- Google Fonts: Cinzel (Dark Fantasy Gothic Serif), Inter (Clean Sans), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              gothic: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
          },
        },
      };
    </script>
    <style>
      /* Corrupted Glitch Text & Chromatic Aberration */
      @keyframes glitch-anim {
        0%, 100% {
          transform: translate(0);
          text-shadow: -1.5px -1.5px 0 #f43f5e, 1.5px 1.5px 0 #06b6d4;
        }
        20% {
          transform: translate(-2px, 1.5px);
          text-shadow: 2px -1px 0 #f43f5e, -2px 1px 0 #06b6d4;
        }
        40% {
          transform: translate(-1.5px, -1px);
          text-shadow: -2px 1.5px 0 #f43f5e, 2px -1.5px 0 #06b6d4;
        }
        60% {
          transform: translate(1.5px, 1.5px);
          text-shadow: 2px 1.5px 0 #f43f5e, -2px -1.5px 0 #06b6d4;
        }
        80% {
          transform: translate(1.5px, -1.5px);
          text-shadow: -1.5px 2px 0 #f43f5e, 1.5px -2px 0 #06b6d4;
        }
      }

      .glitch-text {
        position: relative;
        display: inline-block;
        animation: glitch-anim 2.4s infinite ease-in-out;
        letter-spacing: 0.15em;
      }

      @keyframes glitch-border {
        0%, 100% {
          border-color: rgba(244, 63, 94, 0.7);
          box-shadow: 0 0 15px rgba(244, 63, 94, 0.3), inset 0 0 10px rgba(6, 182, 212, 0.15);
        }
        50% {
          border-color: rgba(168, 85, 247, 0.8);
          box-shadow: 0 0 20px rgba(168, 85, 247, 0.4), inset 0 0 14px rgba(244, 63, 94, 0.2);
        }
      }

      .glitch-card {
        animation: glitch-border 3s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-black select-none overflow-hidden m-0 p-0">
    <!-- Game Canvas -->
    <canvas id="game-canvas" class="block w-full h-full cursor-crosshair"></canvas>

    <!-- Retro CRT Ambient Vignette -->
    <div class="crt-overlay"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
